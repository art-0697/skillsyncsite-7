<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arthy Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .profile-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .profile-container img {
            width: 150px;
            max-width: 100%;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .profile-container h1 {
            margin-bottom: 15px;
        }

        .profile-container h2 {
            margin-top: 20px;
            color: #3AAFA9;
        }

        .profile-container p {
            font-size: 15px;
            line-height: 1.6;
            margin: 8px 0;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #3AAFA9;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #2B7A78;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .profile-container {
                margin: 20px;
                padding: 20px;
            }

            .profile-container h1 {
                font-size: 22px;
            }

            .profile-container h2 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="profile-container">

    <h1>Arthy</h1>

    <img src="https://i.postimg.cc/3xkK6RD5/art1.jpg" alt="Arthy">

    <h2>About Me</h2>
    <p>I am passionate about UI/UX design and Photoshop. I love creating user-friendly digital experiences.</p>

    <h2>Offering</h2>
    <p>UI/UX Design, Photoshop</p>

    <h2>Seeking</h2>
    <p>Python Programming, Data Analysis</p>

    <a href="index.html" class="back-btn">Back to Home</a>

</div>

</body>
</html>
